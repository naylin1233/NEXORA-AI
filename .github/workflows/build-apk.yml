name: Build NEXORA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name nexora_ai .

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          found = False

          for p in files:
              if p.exists():
                  s = p.read_text()
                  s, count = re.subn(
                      r'compileSdk(?:Version)?\s*(?:=\s*|\s+)'
                      r'(?:flutter\.compileSdkVersion|\d+)',
                      'compileSdk = 36',
                      s
                  )
                  if count:
                      p.write_text(s)
                      print(f"Updated {p} to compileSdk 36")
                      found = True

          if not found:
              raise SystemExit("ERROR: compileSdk setting not found")
          PY

      - name: Add Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  s,
                  count=1
              )
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=WORKER_URL=${{ secrets.WORKER_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
